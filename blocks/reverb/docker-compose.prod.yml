services:

  reverb:
    image: ${SPIN_IMAGE_DOCKERFILE_PHP} # 👈 Change this if you're not using `spin deploy`
    networks:
      - web-public
    volumes:
      - "storage_private:/var/www/html/storage/app/private/"
      - "storage_public:/var/www/html/storage/app/public/"
      - "storage_sessions:/var/www/html/storage/framework/sessions"
      - "storage_logs:/var/www/html/storage/logs"
    deploy:
      replicas: 1
      update_config:
        failure_action: rollback
        parallelism: 1
        delay: 5s
        order: start-first
      rollback_config:
        parallelism: 0
        order: stop-first
      restart_policy:
        condition: any
        delay: 10s
        max_attempts: 3
        window: 120s
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.laravel-reverb.rule=Host(`myapp.example.com`) && (PathPrefix(`/app`) || PathPrefix(`/apps`)"
        - "traefik.http.routers.laravel-reverb.entrypoints=websecure"
        - "traefik.http.routers.laravel-reverb.tls=true"
        - "traefik.http.routers.laravel-reverb.tls.certresolver=letsencryptresolver"
        - "traefik.http.services.laravel-reverb.loadbalancer.server.port=8080"
        - "traefik.http.services.laravel-reverb.loadbalancer.server.scheme=http"