services:

  typesense:
    image: typesense/typesense:30.2
    environment:
      TYPESENSE_DATA_DIR: "/data"
      TYPESENSE_API_KEY: "${TYPESENSE_API_KEY}"
      TYPESENSE_ENABLE_CORS: "true"
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8108'"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
