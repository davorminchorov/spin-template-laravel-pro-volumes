services:

  php:
    depends_on:
      mariadb:
        condition: service_started

  mariadb:
    networks:
      - development
    volumes:
      - mariadb_data:/var/lib/mysql
      - ./.infrastructure/conf/mariadb/create-testing-database.sh:/docker-entrypoint-initdb.d/10-create-testing-database.sh:ro
    environment:
        MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
        MARIADB_DATABASE: ${DB_DATABASE:-laravel}
        MARIADB_USER: ${DB_USERNAME:-laravel}
        MARIADB_PASSWORD: ${DB_PASSWORD:-laravel}
    ports:
      - target: 3306
        published: ${DB_FORWARD_PORT:-3306} # Host port, derived per project by post-install.sh
        mode: host

volumes:
  mariadb_data:
