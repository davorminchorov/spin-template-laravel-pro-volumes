services:

  php:
    depends_on:
      mysql:
        condition: service_started

  mysql:
    networks:
      - development
    volumes:
      - mysql_data:/var/lib/mysql
      - ./.infrastructure/conf/mysql/create-testing-database.sh:/docker-entrypoint-initdb.d/10-create-testing-database.sh:ro
    environment:
        MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
        MYSQL_DATABASE: ${DB_DATABASE:-laravel}
        MYSQL_USER: ${DB_USERNAME:-laravel}
        MYSQL_PASSWORD: ${DB_PASSWORD:-laravel}
    ports:
      - target: 3306
        published: ${DB_FORWARD_PORT:-3306} # Host port, derived per project by post-install.sh
        mode: host

volumes:
  mysql_data:
