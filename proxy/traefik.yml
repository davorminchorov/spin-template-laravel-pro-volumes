# Allow self-signed certificates on backends (Vite serves HTTPS with Spin's local cert)
serversTransport:
  insecureSkipVerify: true

providers:
  docker:
    exposedByDefault: false
    network: spin-proxy
  file:
    # One file per project with its TLS certificate (written by post-install.sh)
    directory: /dynamic
    watch: true

entryPoints:
  web:
    address: ":80"
    http:
      redirections:
        entrypoint:
          to: websecure
          scheme: https

  websecure:
    address: ":443"

accessLog: {}
log:
  level: ERROR

api:
  dashboard: true
  insecure: true

ping: {}
