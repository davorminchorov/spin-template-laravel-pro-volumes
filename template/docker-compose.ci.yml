services:

  php:
    build:
      target: ci
      dockerfile: Dockerfile.php
    networks:
      - ci
    volumes:
      - .:/var/www/html/

  node:
    build:
      target: ci
      dockerfile: Dockerfile.node
    volumes:
      - .:/usr/src/app/
    networks: 
      - ci
    working_dir: /usr/src/app/

  mailpit:
    image: axllent/mailpit
    networks:
      - ci

networks:
  ci: