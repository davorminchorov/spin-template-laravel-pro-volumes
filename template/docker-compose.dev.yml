# Routing is handled by the shared proxy in ~/.spin-proxy (see README).
# Services that need a hostname join the external "spin-proxy" network and
# carry Traefik labels. Hostnames below are rewritten to <project>.test and
# <service>.<project>.test by post-install.sh.
services:

  php:
    build:
      target: development
      args:
        USER_ID: ${SPIN_USER_ID}
        GROUP_ID: ${SPIN_GROUP_ID}
      dockerfile: Dockerfile.php
    stop_signal: SIGTERM
    volumes:
      - .:/var/www/html/
    networks:
      - development
      - spin-proxy
    extra_hosts:
      # Let PHP reach its own public hostnames through the shared proxy on the host
      - "laravel.dev.test:host-gateway"
      - "vite.dev.test:host-gateway"
      - "mailpit.dev.test:host-gateway"
      - "reverb.dev.test:host-gateway"
      - "meilisearch.dev.test:host-gateway"
      - "typesense-api.dev.test:host-gateway"
      - "s3.dev.test:host-gateway"
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=spin-proxy"
      - "traefik.http.routers.laravel-web.rule=Host(`laravel.dev.test`) || HostRegexp(`^.+\\.ngrok-free\\.app$$`)"
      - "traefik.http.routers.laravel-web.tls=true"
      - "traefik.http.routers.laravel-web.entrypoints=websecure"
      - "traefik.http.services.laravel-web.loadbalancer.server.port=8443"
      - "traefik.http.services.laravel-web.loadbalancer.server.scheme=https"

  node:
    build:
      target: development
      args:
        USER_ID: ${SPIN_USER_ID}
        GROUP_ID: ${SPIN_GROUP_ID}
      dockerfile: Dockerfile.node
    command: yarn run dev
    volumes:
      - .:/usr/src/app/
    working_dir: /usr/src/app/
    networks:
      - development
      - spin-proxy
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=spin-proxy"
      - "traefik.http.routers.vite.rule=HostRegexp(`vite.dev.test`)"
      - "traefik.http.routers.vite.entrypoints=websecure"
      - "traefik.http.routers.vite.tls=true"
      - "traefik.http.services.vite.loadbalancer.server.port=5173"
      - "traefik.http.services.vite.loadbalancer.server.scheme=https"

  mailpit:
    image: axllent/mailpit
    networks:
      - development
      - spin-proxy
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=spin-proxy"
      - "traefik.http.routers.mailpit.rule=Host(`mailpit.dev.test`)"
      - "traefik.http.routers.mailpit.entrypoints=websecure"
      - "traefik.http.routers.mailpit.tls=true"
      - "traefik.http.services.mailpit.loadbalancer.server.port=8025"
      - "traefik.http.services.mailpit.loadbalancer.server.scheme=http"

networks:
  development:
  spin-proxy:
    external: true
